<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Users | PaaniLink</title>
    <link rel="stylesheet" href="../css/style.css">
  </head>
  <body>
    <div class="dash">
      <aside class="side">
        <a class="logo" href="../index.html"><i></i>PaaniLink</a>
        <nav aria-label="Administrator menu">
          <a href="dashboard.html">Reports</a>
          <a href="zones.html">Zones</a>
          <a href="hydrants.html">Hydrants</a>
          <a href="tankers.html">Tankers</a>
          <a href="rates.html">Rates and limits</a>
          <a href="users.html" class="active">Users</a>
          <a href="../index.html">Back to website</a>
        </nav>
        <div class="user">
          <b id="userName">Loading...</b>
          <span id="userRole">Administrator</span>
          <br>
          <a id="logoutLink" href="../login.html">Log out</a>
        </div>
      </aside>
      <main class="main">
        <h1>Users</h1>
        <p class="welcome">Create staff accounts and control who can sign in.</p>
        <div class="edit-layout">
          <section class="panel">
            <h2 id="userFormTitle">Add user</h2>
            <form id="userForm" action="#" method="post">
              <input type="hidden" id="userId" name="userId">
              <div>
                <label for="userFullName">Full name</label>
                <input id="userFullName" name="userFullName" type="text" placeholder="Full name" required minlength="3" maxlength="60">
                <small class="error" id="userFullNameError"></small>
              </div>
              <div>
                <label for="userPhone">Phone</label>
                <input id="userPhone" name="userPhone" type="tel" placeholder="03XXXXXXXXX" required inputmode="numeric" pattern="03[0-9]{9}" maxlength="11" title="Format: 03XXXXXXXXX">
                <small class="error" id="userPhoneError"></small>
              </div>
              <div>
                <label for="userRoleSelect">Role</label>
                <select id="userRoleSelect" name="userRoleSelect" required>
                  <option value="">Select role</option>
                  <option value="customer">Customer</option>
                  <option value="officer">Zone officer</option>
                  <option value="operator">Hydrant operator</option>
                  <option value="driver">Driver</option>
                  <option value="admin">Administrator</option>
                </select>
                <small class="error" id="userRoleSelectError"></small>
              </div>
              <div>
                <label for="userZone">Zone (zone officers)</label>
                <select id="userZone" name="userZone">
                  <option value="">Not applicable</option>
                </select>
                <small class="error" id="userZoneError"></small>
              </div>
              <div>
                <label for="userHydrant">Hydrant (operators and drivers)</label>
                <select id="userHydrant" name="userHydrant">
                  <option value="">Not applicable</option>
                </select>
                <small class="error" id="userHydrantError"></small>
              </div>
              <div>
                <label for="userPassword">Password</label>
                <input id="userPassword" name="userPassword" type="password" placeholder="At least 8 characters" minlength="8" autocomplete="new-password">
                <small class="error" id="userPasswordError"></small>
              </div>
              <p class="form-error" id="userFormError" role="alert"></p>
              <button class="btn btn-primary" type="submit">Save user</button>
              <button class="btn btn-line" type="reset" id="userCancel">Cancel</button>
            </form>
          </section>
          <section class="panel">
            <h2>All users</h2>
            <form class="toolbar" id="userFilter">
              <div>
                <label class="sr-only" for="uSearch">Search</label>
                <input id="uSearch" name="uSearch" type="search" placeholder="Search by name or phone">
              </div>
              <div>
                <label class="sr-only" for="uRole">Role</label>
                <select id="uRole" name="uRole">
                  <option value="">All roles</option>
                  <option value="customer">Customer</option>
                  <option value="officer">Zone officer</option>
                  <option value="operator">Hydrant operator</option>
                  <option value="driver">Driver</option>
                  <option value="admin">Administrator</option>
                </select>
              </div>
              <div>
                <label class="sr-only" for="uActive">Account</label>
                <select id="uActive" name="uActive">
                  <option value="">All accounts</option>
                  <option value="active">Active</option>
                  <option value="disabled">Disabled</option>
                </select>
              </div>
              <button class="btn btn-primary btn-sm" type="submit">Apply</button>
              <button class="btn btn-line btn-sm" type="reset">Reset</button>
            </form>
            <div class="table-wrap">
              <table>
                <caption class="sr-only">Users</caption>
                <thead>
                  <tr>
                    <th>Name</th>
                    <th>Phone</th>
                    <th>Role</th>
                    <th>Assigned to</th>
                    <th>Status</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="usersBody">
                  <tr class="state">
                    <td colspan="6">Loading...</td>
                  </tr>
                </tbody>
              </table>
            </div>
            <div class="pager">
              <button class="btn btn-line btn-sm" type="button" id="uPrev">Previous</button>
              <span id="uInfo" aria-live="polite">Page 1</span>
              <button class="btn btn-line btn-sm" type="button" id="uNext">Next</button>
            </div>
          </section>
        </div>
      </main>
    </div>
    <div class="toast-area" id="toastArea" aria-live="polite"></div>
    <script src="../js/data.js"></script>
    <script src="../js/app.js"></script>
  </body>
</html>
