<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hydrants | PaaniLink</title>
    <link rel="stylesheet" href="../css/style.css">
  </head>
  <body>
    <div class="dash">
      <aside class="side">
        <a class="logo" href="../index.html"><i></i>PaaniLink</a>
        <nav aria-label="Administrator menu">
          <a href="dashboard.html">Reports</a>
          <a href="zones.html">Zones</a>
          <a href="hydrants.html" class="active">Hydrants</a>
          <a href="tankers.html">Tankers</a>
          <a href="rates.html">Rates and limits</a>
          <a href="users.html">Users</a>
          <a href="../index.html">Back to website</a>
        </nav>
        <div class="user">
          <b id="userName">Loading...</b>
          <span id="userRole">Administrator</span>
          <br>
          <a id="logoutLink" href="../login.html">Log out</a>
        </div>
      </aside>
      <main class="main">
        <h1>Hydrants</h1>
        <p class="welcome">Set daily quota, operating hours and status.</p>
        <div class="edit-layout">
          <section class="panel">
            <h2 id="hydrantFormTitle">Add hydrant</h2>
            <form id="hydrantForm" action="#" method="post">
              <input type="hidden" id="hydrantId" name="hydrantId">
              <div>
                <label for="hydrantName">Hydrant name</label>
                <input id="hydrantName" name="hydrantName" type="text" placeholder="e.g. Hydrant 7 - Korangi" required minlength="3" maxlength="40">
                <small class="error" id="hydrantNameError"></small>
              </div>
              <div>
                <label for="hydrantQuota">Daily quota (gallons)</label>
                <input id="hydrantQuota" name="hydrantQuota" type="number" placeholder="e.g. 60000" required min="1000" max="1000000" step="1000">
                <small class="error" id="hydrantQuotaError"></small>
              </div>
              <div class="row">
                <div>
                  <label for="hydrantOpens">Opens at</label>
                  <input id="hydrantOpens" name="hydrantOpens" type="time" placeholder="" required>
                  <small class="error" id="hydrantOpensError"></small>
                </div>
                <div>
                  <label for="hydrantCloses">Closes at</label>
                  <input id="hydrantCloses" name="hydrantCloses" type="time" placeholder="" required>
                  <small class="error" id="hydrantClosesError"></small>
                </div>
              </div>
              <div>
                <label for="hydrantStatus">Status</label>
                <select id="hydrantStatus" name="hydrantStatus" required>
                  <option value="active">Active</option>
                  <option value="unavailable">Unavailable</option>
                </select>
                <small class="error" id="hydrantStatusError"></small>
              </div>
              <p class="form-error" id="hydrantFormError" role="alert"></p>
              <button class="btn btn-primary" type="submit">Save hydrant</button>
              <button class="btn btn-line" type="reset" id="hydrantCancel">Cancel</button>
            </form>
          </section>
          <section class="panel">
            <h2>All hydrants</h2>
            <form class="toolbar" id="hydrantFilter">
              <div>
                <label class="sr-only" for="hSearch">Search</label>
                <input id="hSearch" name="hSearch" type="search" placeholder="Search hydrants">
              </div>
              <div>
                <label class="sr-only" for="hStatusFilter">Status</label>
                <select id="hStatusFilter" name="hStatusFilter">
                  <option value="">All</option>
                  <option value="active">Active</option>
                  <option value="unavailable">Unavailable</option>
                </select>
              </div>
              <button class="btn btn-primary btn-sm" type="submit">Apply</button>
              <button class="btn btn-line btn-sm" type="reset">Reset</button>
            </form>
            <div class="table-wrap">
              <table>
                <caption class="sr-only">Hydrants</caption>
                <thead>
                  <tr>
                    <th>Hydrant</th>
                    <th>Quota</th>
                    <th>Hours</th>
                    <th>Status</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="hydrantsBody">
                  <tr class="state">
                    <td colspan="5">Loading...</td>
                  </tr>
                </tbody>
              </table>
            </div>
            <div class="pager">
              <button class="btn btn-line btn-sm" type="button" id="hPrev">Previous</button>
              <span id="hInfo" aria-live="polite">Page 1</span>
              <button class="btn btn-line btn-sm" type="button" id="hNext">Next</button>
            </div>
          </section>
        </div>
      </main>
    </div>
    <div class="toast-area" id="toastArea" aria-live="polite"></div>
    <script src="../js/data.js"></script>
    <script src="../js/app.js"></script>
  </body>
</html>
